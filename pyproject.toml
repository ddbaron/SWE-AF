[project]
name = "swe-af"
version = "0.1.0"
description = "Autonomous SWE agent node for AgentField"
requires-python = ">=3.12"
dependencies = [
    # The fork also includes the ReasonerFailed surface required for failed
    # builds to preserve their result instead of reporting success.
    # Profile propagation and the isolated OpenCode provider are consumed from
    # the maintained fork until that capability is released upstream.
    "agentfield @ git+https://github.com/ddbaron/agentfield.git@aa0304577017ee25c405db2a7c2b5fd666f7decc#subdirectory=sdk/python",
    "pydantic>=2.0",
    # Compatibility pin: newer SDK builds have surfaced
    # "Unknown message type: rate_limit_event" during streaming.
    "claude-agent-sdk==0.1.20",
    # HITL plan-approval gate (auto-enabled when HAX_API_KEY is set).
    "hax-sdk>=0.2.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
swe-af = "swe_af.app:main"
swe-fast = "swe_af.fast.app:main"

[tool.setuptools.packages.find]
include = ["swe_af*"]
